   const pill=document.createElement('div');pill.className='hc-region-pill';
   for(const side of ['left','left-edge','right','right-edge']){const glint=document.createElement('img');glint.className='hc-glint hc-glint-'+side;glint.src=clusterAssets['map_cluster_glint_'+side.replace('-','_')];glint.alt='';pill.appendChild(glint);}

  });
  const top=210,bottom=560,gap=7;
  function placeColumn(items,columnX){
   items.sort((a,b)=>a.y-b.y);let edge=top;
   items.forEach(item=>{

   });

   markers.sort((a,b)=>a.x-b.x);const split=Math.ceil(markers.length/2),left=markers.slice(0,split),right=markers.slice(split);
   placeColumn(left,8+Math.max(...left.map(m=>m.w))/2);
   placeColumn(right,394-Math.max(...right.map(m=>m.w))/2);
  }
 }

 function renderPhone(v){
  const rect=viewport(v.view),zoom=v.zoom,zw=zoom.clientWidth,zh=zoom.clientHeight,scale=zw/rect[2];zoom.replaceChildren();zoom.setAttribute('viewBox',`0 0 ${zw} ${zh}`);v.native.style.zoom=zw/402;
  const g=svgNode('g',{transform:`scale(${scale}) translate(${-rect[0]} ${-rect[1]})`},zoom);
  projected.forEach(f=>svgNode('path',{d:f.path,fill:colors[f.code]||'var(--muted)','fill-opacity':v.regions.includes(f.code)?'.38':'.13',stroke:colors[f.code]||'var(--border)','stroke-width':1,'vector-effect':'non-scaling-stroke'},g));
  drawRegionClusters(v,rect,scale);
 }
 function draw(){
  const rect=viewport(position);drag.style.left=(position.x*(width-76))+'px';drag.style.top=(map.getBoundingClientRect().top-overview.getBoundingClientRect().top+position.y*(height-157.05))+'px';
  const hintHalf=hint.getBoundingClientRect().width/2||80,phoneLeft=position.x*(width-76);
  hint.style.left=(Math.max(hintHalf+4,Math.min(width-hintHalf-4,phoneLeft+38))-phoneLeft)+'px';
  hint.style.top=(position.y*(height-157.05)<58?165:-60)+'px';
  active=projected.filter(f=>regionCodes.includes(f.code)&&intersects(f.polygons,rect)).map(f=>f.code);
  map.querySelectorAll('path').forEach(el=>{const code=el.dataset.code;el.setAttribute('fill',colors[code]||'var(--muted)');el.setAttribute('fill-opacity',active.includes(code)?'.38':regionCodes.includes(code)?'.10':'.45');el.setAttribute('stroke',colors[code]||'var(--border)');el.setAttribute('stroke-width',active.includes(code)?'1.6':'.8');});
 }
 function layout(){
  width=map.clientWidth;height=map.clientHeight;map.setAttribute('viewBox',`0 0 ${width} ${height}`);
  // Frame the mainland area; retain original geometry for map drawing and intersection.
  const framingFeatures=data.features.filter(f=>['11','23','31'].includes(f.properties.code)).map(f=>f.properties.code==='23'?{...f,geometry:{...f.geometry,coordinates:f.geometry.coordinates.filter(poly=>poly[0].some(([longitude])=>longitude>=126.2))}}:f);
  projection=d3.geoMercator().fitExtent([[10,12],[width-10,height-12]],{type:'FeatureCollection',features:framingFeatures});
  const fittedTranslation=projection.translate();
  projection.scale(projection.scale()*.84).translate([width/2+(fittedTranslation[0]-width/2)*.84,height/2+(fittedTranslation[1]-height/2)*.84]);
  const path=d3.geoPath(projection),labelPath=d3.geoPath(d3.geoMercator().scale(projection.scale()).translate(projection.translate()).center(projection.center()).clipExtent([[14,14],[width-14,height-14]]));
  data.features.filter(f=>['32','33','34'].includes(f.properties.code)).forEach(f=>{const point=labelPath.centroid(f);if(point.every(Number.isFinite))centers[f.properties.code]=projection.invert(point);else centers[f.properties.code]=d3.geoCentroid(f);});
  projected=data.features.map(f=>({code:f.properties.code,path:path(f),polygons:(f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates).map(poly=>poly.map(ring=>ring.map(projection)))}));
  map.replaceChildren();projected.forEach(f=>svgNode('path',{d:f.path,'data-code':f.code},map));regionCodes.forEach(code=>{const p=projection(centers[code]);svgNode('text',{x:p[0],y:p[1],'text-anchor':'middle'},map).textContent=names[code];});draw();variants.forEach(v=>{if(!v.zoom.children.length)v.regions=[...active];renderPhone(v);});
 }
 function save(){window.openai?.setWidgetState?.({modelContent:{scene:'시도 집계 p95 3종 동시 비교',replaySpeed:'10배 느린 재생',p95ms:variants.map(v=>({version:v.name,ms:v.ms})),requests:requestId,regions:active.map(c=>names[c])},privateContent:{position}})?.catch(()=>{});}
 function startComparison(){
  const key=`${position.x.toFixed(5)},${position.y.toFixed(5)}`;if(key===lastRequested)return;lastRequested=key;cancelAnimationFrame(raf);const token=++runToken,id=++requestId,view={...position},regions=[...active],maxMs=Math.max(...variants.map(v=>v.ms));
  variants.forEach(v=>{v.done=false;v.section.dataset.waiting='true';v.state.textContent='응답 대기 · 이전 지도 표시';v.bar.style.width='0%';v.progress.setAttribute('aria-valuenow','0');});
  announcement.textContent=`비교 ${id} 시작. 세 방식이 동시에 출발합니다.`;
  const began=performance.now();
  function tick(now){
   if(token!==runToken)return;const elapsed=Math.min(maxMs*10,now-began),measured=elapsed/10;
   variants.forEach(v=>{
    const pct=Math.min(100,measured/v.ms*100);v.bar.style.width=pct+'%';v.progress.setAttribute('aria-valuenow',Math.round(pct));
    if(measured>=v.ms&&!v.done){v.done=true;v.view={...view};v.regions=[...regions];renderPhone(v);delete v.section.dataset.waiting;v.state.textContent=`새 지도 도착 · 재생 ${(v.ms/100).toFixed(2)}초`;announcement.textContent=v.name+' 새 지도 도착';}
   });
   if(measured<maxMs)raf=requestAnimationFrame(tick);else{announcement.textContent='세 방식 모두 완료. 최종 개선, 지역 코드, 부모 JOIN 순으로 도착했습니다.';save();}
  }
  // Reduced motion preserves the measured waiting times while skipping bar motion.
  if(reduced.matches){variants.forEach(v=>v.bar.style.opacity='0');}else{variants.forEach(v=>v.bar.style.opacity='1');}
  raf=requestAnimationFrame(tick);save();
 }
 function selectRate(next){
  if(next===rate)return;
  rate=next;
  variants.forEach(v=>{v.ms=measurements.rates[rate][v.key].p95.sido;v.measured.textContent=`${v.ms.toFixed(2)} ms`;});
  renderRate();
  window.parent.postMessage({type:'hiyu-map-rate-change',rate},location.origin);
  lastRequested=null;
  startComparison();
 }
 rateButtons.forEach(button=>button.addEventListener('click',()=>selectRate(Number(button.dataset.rate))));
 rateTabs.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
  event.preventDefault();
  const next=event.key==='Home'?100:event.key==='End'?150:rate===100?150:100;
  selectRate(next);
  rateButtons.find(button=>Number(button.dataset.rate)===next).focus({preventScroll:true});
 });
 let moving=false,offset=[0,0],startKey='';
 drag.addEventListener('pointerdown',e=>{markInteracted();root.dataset.dragging='true';moving=true;startKey=`${position.x.toFixed(5)},${position.y.toFixed(5)}`;offset=[e.clientX-drag.getBoundingClientRect().left,e.clientY-drag.getBoundingClientRect().top];drag.setPointerCapture(e.pointerId);e.preventDefault();});
 drag.addEventListener('pointermove',e=>{if(!moving)return;const b=map.getBoundingClientRect();position={x:Math.max(0,Math.min(1,(e.clientX-b.left-offset[0])/(width-76))),y:Math.max(0,Math.min(1,(e.clientY-b.top-offset[1])/(height-157.05)))};draw();});
 map.addEventListener('click',e=>{const b=map.getBoundingClientRect();markInteracted();position={x:Math.max(0,Math.min(1,(e.clientX-b.left-38)/(width-76))),y:Math.max(0,Math.min(1,(e.clientY-b.top-78.525)/(height-157.05)))};draw();startComparison();});
 drag.addEventListener('pointerup',()=>{delete root.dataset.dragging;moving=false;if(startKey!==`${position.x.toFixed(5)},${position.y.toFixed(5)}`)startComparison();});drag.addEventListener('pointercancel',()=>{delete root.dataset.dragging;moving=false;});
 drag.addEventListener('lostpointercapture',()=>{delete root.dataset.dragging;moving=false;});
 drag.addEventListener('keydown',e=>{const d={ArrowLeft:[-.035,0],ArrowRight:[.035,0],ArrowUp:[0,-.035],ArrowDown:[0,.035]}[e.key];if(!d)return;e.preventDefault();markInteracted();position={x:Math.max(0,Math.min(1,position.x+d[0])),y:Math.max(0,Math.min(1,position.y+d[1]))};draw();startComparison();});
 function restore(state){const p=state?.privateContent?.position;if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)){position={x:Math.max(0,Math.min(1,p.x)),y:Math.max(0,Math.min(1,p.y))};}}
 restore(window.openai?.widgetState);variants.forEach(v=>v.view={...position});window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);draw();});new ResizeObserver(layout).observe(root);layout();
})();
