<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>서버 재시작과 알림 예약 비교</title><link rel="stylesheet" href="/technology/notification-compare.css"><link rel="stylesheet" href="/technology/interaction-cues.css"></head><body><div id="hiyu-notification-restart"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="notification-bell"><path d="M255.9 456c31.1 0 48.1-22 48.1-53h-96.3c0 31 17 53 48.2 53z" fill="currentColor"/><path d="M412 352.2c-15.4-20.3-45.7-32.2-45.7-123.1 0-93.3-41.2-130.8-79.6-139.8-3.6-.9-6.2-2.1-6.2-5.9v-2.9c0-13.4-11-24.7-24.4-24.6-13.4-.2-24.4 11.2-24.4 24.6v2.9c0 3.7-2.6 5-6.2 5.9-38.5 9.1-79.6 46.5-79.6 139.8 0 90.9-30.3 102.7-45.7 123.1-9.9 13.1-.5 31.8 15.9 31.8h280.1c16.3 0 25.7-18.8 15.8-31.8z" fill="currentColor"/></g></defs></svg><section class="demo" aria-label="알림 예약이 서버 메모리에서 사라지는 경우와 RDB에 보존되는 경우 비교">
<div class="notification-demo-body">
<div class="toolbar"><button type="button" class="cursor-interaction" data-start aria-label="서버 재시작해 보기"><span aria-hidden="true">▶</span><span data-button aria-hidden="true"><span class="start-label">서버 재시작해 보기</span><span class="replay-label">다시 비교하기</span></span></button><div class="steps"><span data-step="save" data-active="true">예약</span><span aria-hidden="true">→</span><span data-step="swap">재시작</span><span aria-hidden="true">→</span><span data-step="send">발송</span></div></div>
<div class="comparison">
<section class="side" data-side="before"><h3>개선 전<small>메모리에만 보관</small></h3>
<div class="server-status" data-server-status></div><div class="containers">
<svg class="server-error" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4L28 28M28 4L4 28" /></svg><div class="container" data-color="orange" data-on="true"><div class="server-label">서버</div><div class="inside"><div class="pile" data-pile="server" data-show="true" role="img" aria-label="서버 메모리에 알림 예약 3건"><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span></div></div></div>
</div><div class="lower"><div class="memory-fate"><b data-memory-result>메모리에 예약 보관</b></div></div>
<div class="delivery" data-sent="false"><div class="pile" data-pile="fcm" data-show="false" aria-hidden="true"><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span></div><span>FCM<b data-delivery>대기</b></span></div>
</section>
<section class="side" data-side="after"><h3>개선 후<small>RDB 아웃박스에 기록</small></h3>
<div class="server-status" data-server-status></div><div class="containers">
<svg class="server-error" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4L28 28M28 4L4 28" /></svg><div class="container" data-color="orange" data-on="true"><div class="server-label">서버</div><div class="inside"><div class="pile" data-pile="server" data-show="true" role="img" aria-label="RDB에 기록할 알림 예약 3건"><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span></div></div></div>
</div>
<div class="lower"><div class="wires" aria-label="서버에서 RDB로 기록하고 재시작 후 조회"><span class="wire" data-direction="down" data-active="true"><svg viewBox="0 0 20 24" fill="none" aria-hidden="true"><path d="M10 2V22M4 16L10 22L16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></span></div><div class="database"><svg class="db-shell" viewBox="0 0 190 112" aria-hidden="true"><path class="db-shadow" d="M3 21V95C3 115 187 115 187 95V21Z"/><path class="db-body" d="M3 17V91C3 111 187 111 187 91V17Z"/><path class="db-seam" d="M3 80C3 100 187 100 187 80"/><ellipse class="db-top" cx="95" cy="17" rx="92" ry="15"/></svg><div class="db-name">RDB <small>· 아웃박스</small></div><div class="db-content"><div class="pile" data-pile="db" data-show="false" role="img" aria-label="RDB에 보존되는 알림 예약 3건"><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span></div><span class="db-count"><span data-db-state>기록 전</span><b data-db-count>0</b></span></div></div></div>
<div class="delivery" data-sent="false"><div class="pile" data-pile="fcm" data-show="false" aria-hidden="true"><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span><span class="bell-item"><svg aria-hidden="true" viewBox="0 0 512 512"><use href="#notification-bell" /></svg></span></div><span>FCM<b data-delivery>대기</b></span></div>
</section></div>
</div>
<p class="note">종은 기존 알림 예약을 뜻해요. 개선 전의 재탐색·새 예약 생성은 생략했습니다.<br>재시작 흐름을 단순화한 설명용 시연이며 실제 처리 시간과는 다릅니다.</p>
</section></div><script src="/technology/notification-compare.js"></script></body></html>
